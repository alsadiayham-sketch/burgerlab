<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Lab | تم استلام الطلب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .confirmation-page { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; }
        .confirmation-card {
            width: min(760px, 100%);
            background: linear-gradient(180deg, rgba(45,45,45,0.96), rgba(29,29,29,0.96));
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 28px;
            padding: 32px;
            box-shadow: var(--shadow-hover);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .confirmation-card h1 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 10px; }
        .confirmation-card > p { color: var(--text-light); }
        .success-mark {
            width: 82px; height: 82px; margin: 0 auto 18px; border-radius: 50%;
            display: grid; place-items: center; font-size: 2rem; font-weight: 900;
            background: rgba(255,140,0,0.18); color: #ffd6a2; border: 1px solid rgba(255,140,0,0.3);
        }
        .summary-box {
            margin-top: 24px; text-align: right; background: rgba(255,255,255,0.04);
            border-radius: 22px; padding: 22px; border: 1px solid rgba(255,255,255,0.06);
        }
        .summary-box h3 { margin-bottom: 14px; }
        .summary-item {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .summary-item:last-child { border-bottom: none; }
        .summary-item small { display: block; color: var(--text-light); margin-top: 4px; }
        .summary-totals { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); display: grid; gap: 10px; }
        .summary-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .summary-row.total { color: var(--accent); font-weight: 900; font-size: 1.2rem; }
        .customer-info { margin-top: 16px; display: grid; gap: 8px; color: var(--text-light); }
        .confirmation-actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 20; }
        .confetti-piece { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 4px; animation: fall linear forwards; }
        @keyframes fall { from { transform: translateY(-10vh) rotate(0deg); opacity: 1; } to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>
    <div class="confetti" id="confetti"></div>
    <div class="confirmation-page">
        <div class="confirmation-card">
            <div class="success-mark">✓</div>
            <h1>تم استلام طلبك</h1>
            <p id="orderLead">سيتم التواصل معك لتأكيد الطلب.</p>
            <div class="summary-box">
                <h3 id="orderId"></h3>
                <div id="orderItems"></div>
                <div class="summary-totals">
                    <div class="summary-row"><span>عدد القطع</span><strong id="orderCount"></strong></div>
                    <div class="summary-row"><span>نوع الطلب</span><strong id="orderMode"></strong></div>
                    <div class="summary-row total"><span>الإجمالي</span><strong id="orderTotal"></strong></div>
                </div>
                <div class="customer-info" id="customerInfo"></div>
            </div>
            <div class="confirmation-actions">
                <a href="#" class="btn-primary" id="sendWhatsappBtn">إرسال الطلب عبر واتساب</a>
                <a href="index.html" class="btn-secondary">العودة للقائمة</a>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var order = null;
            try { order = JSON.parse(localStorage.getItem('burgerlab_last_order') || 'null'); }
            catch (error) { order = null; }
            if (!order) {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('orderId').textContent = 'رقم الطلب: ' + order.id;
            renderOrderItems(order);
            document.getElementById('orderCount').textContent = getItemCount(order.items);
            document.getElementById('orderMode').textContent = order.orderMode === 'takeout' ? 'سفري' : 'داخل المطعم';
            document.getElementById('orderTotal').textContent = order.orderMode === 'takeout' ? formatCurrency(order.total) + ' (+ توصيل)' : formatCurrency(order.total);
            renderCustomerInfo(order);
            document.getElementById('sendWhatsappBtn').href = order.whatsappUrl || buildWhatsAppUrl(DEFAULT_SITE_SETTINGS.whatsappNumber, 'مرحبا، بخصوص الطلب ' + order.id);
            createConfetti();
        });

        function getItemCount(items) {
            var count = 0;
            var i;
            for (i = 0; i < items.length; i += 1) count += Number(items[i].qty) || 0;
            return count + ' قطعة';
        }

        function renderOrderItems(order) {
            var html = '';
            var i;
            for (i = 0; i < order.items.length; i += 1) {
                html += '<div class="summary-item"><div><strong>' + escapeHtml(order.items[i].name) + '</strong><small>' + escapeHtml(order.items[i].sizeLabel) + ' × ' + order.items[i].qty + '</small></div><strong>' + formatCurrency(order.items[i].lineTotal) + '</strong></div>';
            }
            document.getElementById('orderItems').innerHTML = html;
        }

        function renderCustomerInfo(order) {
            var html = '';
            html += '<div><strong>الاسم:</strong> ' + escapeHtml(order.customerName) + '</div>';
            html += '<div><strong>الهاتف:</strong> ' + escapeHtml(order.customerPhone) + '</div>';
            if (order.orderMode === 'takeout') html += '<div><strong>العنوان:</strong> ' + escapeHtml(order.address) + '</div>';
            if (order.notes) html += '<div><strong>ملاحظات:</strong> ' + escapeHtml(order.notes) + '</div>';
            html += '<div><strong>وقت الطلب:</strong> ' + escapeHtml(formatDateTime(order.date)) + '</div>';
            html += '<div><strong>الملاحظة:</strong> سيتم التواصل معك لتأكيد الطلب.</div>';
            document.getElementById('customerInfo').innerHTML = html;
        }

        function createConfetti() {
            var colors = ['#e63946', '#ff6b6b', '#ff8c00', '#f4a261', '#ffd166'];
            var container = document.getElementById('confetti');
            var i;
            for (i = 0; i < 60; i += 1) {
                var piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = (2.8 + Math.random() * 2.6) + 's';
                piece.style.animationDelay = (Math.random() * 1.5) + 's';
                piece.style.opacity = String(0.7 + Math.random() * 0.3);
                container.appendChild(piece);
            }
            setTimeout(function () {
                if (container && container.parentNode) container.parentNode.removeChild(container);
            }, 6500);
        }
    </script>
</body>
</html>
